repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.10
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [ --fix ]
        files: ^probscale/
      # Run the formatter.
      - id: ruff-format
        files: ^probscale/

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args:
          - --py312-plus
